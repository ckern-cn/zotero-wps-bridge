name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 issue，并确认使用的是最新版本。

        **安全漏洞请不要在这里公开**，请按 SECURITY.md 私密报告。

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 请填写具体版本。
      placeholder: Windows 11 / macOS 14 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: wps
    attributes:
      label: WPS 版本
      description: 在 WPS 的“关于”或帮助菜单中查看。
      placeholder: 例如 12.1.2
    validations:
      required: true

  - type: input
    id: zotero
    attributes:
      label: Zotero 版本
      description: 在 Zotero 的“关于”中查看。
      placeholder: 例如 10.0.8
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - 在 Zotero 设置中安装/修复 WPS 加载项
        - 手动安装独立 ZIP
        - 从源码构建
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出能稳定复现问题的最少步骤。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先删除令牌、文献内容、文件路径等敏感信息。
      placeholder: 可粘贴脱敏后的日志、截图或录屏链接。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 issue。
          required: true
        - label: 我使用的是最新版本，或已说明为何不能升级。
          required: true
        - label: 我已删除日志中的令牌和其他敏感信息。
          required: true
