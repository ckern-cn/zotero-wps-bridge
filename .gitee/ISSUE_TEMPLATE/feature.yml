name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先搜索已有 issue，避免重复。

        本项目所有已发布功能免费，不设付费版或捐赠解锁功能。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你现在遇到什么不便？在什么场景下需要这个功能？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该功能应对所有用户免费开放，不设付费墙。
          required: true
        - label: 我理解是否采纳、何时实现由维护者决定。
          required: true
