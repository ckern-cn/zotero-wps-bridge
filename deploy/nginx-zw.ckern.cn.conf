# /etc/nginx/conf.d/zw.ckern.cn.conf
# Adjust the certificate paths if your certificate is not managed by certbot
# for the ckern.cn zone.

server {
    listen 80;
    listen [::]:80;
    server_name zw.ckern.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zw.ckern.cn;

    root /var/www/zw.ckern.cn;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/ckern.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ckern.cn/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        application/json                      json;
        image/svg+xml                         svg;
        image/png                             png;
        application/x-xpinstall               xpi;
        application/zip                       zip;
        text/plain                            txt;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /updates.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /downloads/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
