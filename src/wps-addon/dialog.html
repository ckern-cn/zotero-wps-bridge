<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zotero WPS Bridge</title>
<style>
    :root {
        color-scheme: light dark;
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        height: 100%;
    }

    body {
        margin: 0;
        padding: 0;
        overflow: auto;
        background: #ffffff;
        color: #1f2937;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
            "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .zwps-dialog {
        width: 100%;
        max-width: none;
        min-height: 100%;
        padding: 26px 30px 22px;
        border-top: 5px solid #1fa99b;
        border-radius: 0;
        background: #ffffff;
        box-shadow: none;
    }

    .zwps-dialog.success {
        border-top-color: #1fa99b;
    }

    .zwps-dialog.warning {
        border-top-color: #d97706;
    }

    .zwps-dialog.error {
        border-top-color: #e84f45;
    }

    .zwps-dialog h1 {
        margin: 0 0 16px;
        font-size: 21px;
        line-height: 1.35;
    }

    .zwps-dialog pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.7;
    }

    .zwps-dialog-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 24px;
    }

    .zwps-dialog button {
        min-width: 104px;
        padding: 9px 22px;
        border: 0;
        border-radius: 8px;
        background: #1f6feb;
        color: #ffffff;
        font-size: 14px;
        cursor: pointer;
    }

    .zwps-dialog button:hover {
        background: #1557b0;
    }

    .zwps-donate {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
    }

    .zwps-donate h2 {
        margin: 0 0 6px;
        font-size: 16px;
        line-height: 1.4;
    }

    .zwps-donate p {
        margin: 0;
        color: #5b6b7a;
        font-size: 13px;
        line-height: 1.6;
    }

    .zwps-donate-codes {
        display: flex;
        gap: 20px;
        margin-top: 14px;
    }

    .zwps-donate-code {
        text-align: center;
        color: #5b6b7a;
        font-size: 12px;
    }

    .zwps-donate-code img {
        display: block;
        width: 104px;
        height: 104px;
        margin: 0 auto 5px;
        padding: 4px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
    }

    .zwps-donate-note {
        margin-top: 12px !important;
        color: #8a97a4 !important;
        font-size: 11px !important;
    }

    @media (prefers-color-scheme: dark) {
        body {
            background: #1b1b1f;
            color: #e5e7eb;
        }

        .zwps-dialog {
            background: #2a2a30;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
        }

        .zwps-dialog button {
            background: #3b82f6;
        }

        .zwps-dialog button:hover {
            background: #2563eb;
        }

        .zwps-donate {
            border-top-color: #4a4a51;
        }

        .zwps-donate p,
        .zwps-donate-code {
            color: #b9b9c0;
        }

        .zwps-donate-code img {
            border-color: #4a4a51;
        }

        .zwps-donate-note {
            color: #a0a0a8 !important;
        }
    }
</style>
</head>
<body>
    <main class="zwps-dialog" id="dialog">
        <h1 id="title">Zotero WPS Bridge</h1>
        <pre id="body"></pre>
        <section class="zwps-donate" id="donate" hidden>
            <h2 id="donate-title"></h2>
            <p id="donate-copy"></p>
            <div class="zwps-donate-codes">
                <div class="zwps-donate-code">
                    <img id="donate-alipay-img" src="images/donate-alipay.png" alt=""/>
                    <span id="donate-alipay"></span>
                </div>
                <div class="zwps-donate-code">
                    <img id="donate-wechat-img" src="images/donate-wechat.png" alt=""/>
                    <span id="donate-wechat"></span>
                </div>
            </div>
            <p class="zwps-donate-note" id="donate-note"></p>
        </section>
        <div class="zwps-dialog-actions">
            <button id="close" type="button" autofocus>Close</button>
        </div>
    </main>
<script>
(function () {
    'use strict';

    var params = new URLSearchParams(window.location.search);
    var key = params.get('key') || '';
    var data = null;

    function storage() {
        try {
            if (window.wps && window.wps.PluginStorage) {
                return window.wps.PluginStorage;
            }
            if (window.Application && window.Application.PluginStorage) {
                return window.Application.PluginStorage;
            }
        }
        catch (e) {}
        return null;
    }

    try {
        var store = storage();
        var raw = store && key ? store.getItem(key) : null;
        if (raw) {
            data = JSON.parse(raw);
        }
    }
    catch (e) {}

    // ShowDialog pages do not always expose the wps object. app.js also puts
    // the payload in the URL so the dialog still renders in that case.
    if (!data) {
        try {
            var payload = params.get('payload');
            if (payload) {
                data = JSON.parse(payload);
            }
        }
        catch (e) {}
    }

    data = data || {
        title: 'Zotero WPS Bridge',
        body: 'Zotero WPS Bridge',
        type: 'info',
        closeLabel: 'Close'
    };

    var dialog = document.getElementById('dialog');
    dialog.className = 'zwps-dialog ' + (data.type || 'info');
    document.getElementById('title').textContent = data.title || '';
    document.getElementById('body').textContent = data.body || '';
    document.getElementById('close').textContent = data.closeLabel || 'Close';
    document.title = data.title || 'Zotero WPS Bridge';

    if (data.donate) {
        var donate = data.donate;
        document.getElementById('donate-title').textContent = donate.title || '';
        document.getElementById('donate-copy').textContent = donate.copy || '';
        document.getElementById('donate-note').textContent = donate.note || '';
        document.getElementById('donate-alipay').textContent = donate.alipay || '';
        document.getElementById('donate-wechat').textContent = donate.wechat || '';
        document.getElementById('donate-alipay-img').alt = donate.alipay || '';
        document.getElementById('donate-wechat-img').alt = donate.wechat || '';
        document.getElementById('donate').hidden = false;
    }

    function close() {
        try {
            var store = storage();
            if (store && key && typeof store.removeItem === 'function') {
                store.removeItem(key);
            }
        }
        catch (e) {}
        try {
            window.close();
        }
        catch (e) {}
    }

    document.getElementById('close').addEventListener('click', close);
    window.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' || event.key === 'Enter') {
            close();
        }
    });
})();
</script>
</body>
</html>
